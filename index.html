<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BlockBound — the official server item documentation.">
  <title>BlockBound — Item Documentation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-b"></div>

  <header class="site-header">
    <a class="brand" href="#/docs">
      <span class="brand-mark"><img src="server-icon.png" alt="BlockBound"></span>
      <span>BLOCK<span>BOUND</span></span>
    </a>
    <div class="header-actions">
      <span class="live-dot"></span><span id="header-status">Checking server…</span>
    </div>
  </header>

  <div class="quick-actions">
    <div class="quick-actions-inner">
      <div class="ip-box"><span id="server-ip-text">mc.block-bound.org</span><button class="button" id="copy-ip" type="button">Copy IP</button></div>
      <div class="discord-box"><span id="discord-link-text">https://discord.gg/HvhGY599GK</span><button class="button" id="discord-button" type="button">Join</button></div>
    </div>
  </div>

  <main id="app"></main>

  <footer class="footer">
    <div class="footer-brand">
      <span class="brand-mark small"><img src="server-icon.png" alt="BlockBound"></span>
      <div><strong>BLOCKBOUND</strong><small>A server built around your island.</small></div>
    </div>
    <div class="footer-copy">© 2026 BlockBound. Not affiliated with Mojang Studios.</div>
  </footer>

  <script src="registry.js"></script>
  <script src="app.js"></script>
</body>
</html>
